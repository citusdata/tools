name: diag-signing-secret

# TEMP DIAGNOSTIC — safe to delete. Reads PACKAGING_SECRET_KEY / PACKAGING_PASSPHRASE
# and prints ONLY non-sensitive metadata (lengths, character-class shape, whether a
# cleaned copy imports, imported key capabilities/expiry). It NEVER prints key material
# or the passphrase. Used to determine why the nightly signing legs report
# "No secret key". Expected format (see common_tool_methods.transform_key_into_base64_str)
# is a single clean line of base64(ascii-armored-secret-key).

on:
  push:
    branches:
      - diag/signing-secret
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect signing secret (metadata only, never prints key material)
        env:
          PACKAGING_SECRET_KEY: ${{ secrets.PACKAGING_SECRET_KEY }}
          PACKAGING_PASSPHRASE: ${{ secrets.PACKAGING_PASSPHRASE }}
        run: |
          set +e
          printf '%s' "$PACKAGING_SECRET_KEY" > /tmp/raw

          echo "::group::1. Presence / length"
          LEN=$(wc -c < /tmp/raw)
          PLEN=$(printf '%s' "$PACKAGING_PASSPHRASE" | wc -c)
          echo "PACKAGING_SECRET_KEY length (bytes): $LEN"
          echo "PACKAGING_PASSPHRASE length (bytes): $PLEN"
          if [ "$LEN" -eq 0 ]; then echo "VERDICT: CASE 1 (EMPTY/UNSCOPED)"; exit 0; fi
          echo "::endgroup::"

          echo "::group::2. Character-class shape (no key bytes printed)"
          CR=$(tr -cd '\r' < /tmp/raw | wc -c)
          LF=$(tr -cd '\n' < /tmp/raw | wc -c)
          SP=$(tr -cd ' ' < /tmp/raw | wc -c)
          # bytes that are NOT base64-alphabet, '=', CR, LF or space:
          BAD=$(tr -d 'A-Za-z0-9+/=\r\n ' < /tmp/raw | wc -c)
          echo "carriage-returns (\\r): $CR"
          echo "line-feeds (\\n): $LF"
          echo "spaces: $SP"
          echo "bytes outside [A-Za-z0-9+/= \\r \\n]: $BAD"
          echo "starts with armored header? $(head -c 64 /tmp/raw | grep -a -c 'BEGIN PGP')"
          echo "position of first non-base64/LF byte: $(LC_ALL=C grep -aob '[^A-Za-z0-9+/=\r\n]' /tmp/raw 2>/dev/null | head -n1 | cut -d: -f1)"
          echo "::endgroup::"

          import_and_report() {
            label="$1"; file="$2"
            export GNUPGHOME=$(mktemp -d); chmod 700 "$GNUPGHOME"
            gpg --batch --import "$file" 2>/tmp/imp.err
            rc=$?
            armored=$(head -c 64 "$file" | grep -a -c 'BEGIN PGP')
            nkeys=$(gpg --list-secret-keys --with-colons 2>/dev/null | grep -c '^sec')
            nsign=$(gpg --list-secret-keys --with-colons 2>/dev/null | awk -F: '/^sec|^ssb/ {print $12}' | grep -c 's')
            echo "[$label] decoded-is-armored=$armored import_rc=$rc secret_keys=$nkeys sign_capable_secrets=$nsign"
            if [ "$nkeys" -gt 0 ]; then
              echo "[$label] key metadata (caps/expiry, no private material):"
              gpg --list-secret-keys --keyid-format long 2>/dev/null | grep -E 'sec|ssb|uid|\['
            fi
          }

          echo "::group::3. Try decoding strategies (find what makes it import)"
          # a) as-is base64
          base64 -d < /tmp/raw > /tmp/a.bin 2>/dev/null; import_and_report "as-is base64 -d" /tmp/a.bin
          # b) strip CR then base64
          tr -d '\r' < /tmp/raw | base64 -d > /tmp/b.bin 2>/dev/null; import_and_report "strip-CR + base64 -d" /tmp/b.bin
          # c) ignore-garbage base64
          base64 --ignore-garbage -d < /tmp/raw > /tmp/c.bin 2>/dev/null; import_and_report "base64 --ignore-garbage -d" /tmp/c.bin
          # d) treat raw value itself as the key (armored or binary)
          import_and_report "raw value as key" /tmp/raw
          echo "::endgroup::"

          echo "::group::Verdict hint"
          echo "If a 'strip-CR' or 'ignore-garbage' variant imports with sign_capable_secrets>=1,"
          echo "the secret is just dirty (CRLF / stray chars) and must be re-stored as ONE clean"
          echo "base64 line: gpg --export-secret-keys --armor <fpr> | base64 -w0"
          echo "If NONE import, the stored value is not a key export at all and must be regenerated."
          echo "::endgroup::"
          exit 0
