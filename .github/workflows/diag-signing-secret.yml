name: diag-signing-secret

# TEMP DIAGNOSTIC — safe to delete. Confirms whether PACKAGING_SECRET_KEY contains a
# PRIVATE (secret) key or only a PUBLIC key. Prints ONLY non-sensitive metadata:
# the armor header TYPE, public-vs-secret key counts, and the key fingerprint/uid
# (both of which are public information). Never prints private key material or the
# passphrase.

on:
  push:
    branches:
      - diag/signing-secret
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm public-vs-secret key (metadata only)
        env:
          PACKAGING_SECRET_KEY: ${{ secrets.PACKAGING_SECRET_KEY }}
          PACKAGING_PASSPHRASE: ${{ secrets.PACKAGING_PASSPHRASE }}
        run: |
          set +e
          printf '%s' "$PACKAGING_SECRET_KEY" > /tmp/raw

          echo "::group::Armor header type (non-sensitive)"
          echo "secret length (bytes): $(wc -c < /tmp/raw)   passphrase length: $(printf '%s' "$PACKAGING_PASSPHRASE" | wc -c)"
          echo "header line(s) found:"
          grep -a -o 'BEGIN PGP[A-Z ]*' /tmp/raw | sort -u | sed 's/^/  -----/'
          grep -a -o 'END PGP[A-Z ]*'   /tmp/raw | sort -u | sed 's/^/  -----/'
          echo "::endgroup::"

          echo "::group::Import the raw value and count PUBLIC vs SECRET keys"
          export GNUPGHOME=$(mktemp -d); chmod 700 "$GNUPGHOME"
          gpg --batch --import /tmp/raw 2>/tmp/imp.err
          echo "gpg import stderr:"; sed 's/^/    /' /tmp/imp.err
          PUB=$(gpg --list-keys --with-colons 2>/dev/null | grep -c '^pub')
          SEC=$(gpg --list-secret-keys --with-colons 2>/dev/null | grep -c '^sec')
          echo "PUBLIC keys imported: $PUB"
          echo "SECRET keys imported: $SEC"
          echo "--- public keyring (fingerprint + uid are PUBLIC info) ---"
          gpg --list-keys --keyid-format long 2>/dev/null | grep -E 'pub|uid|sub|\['
          echo "::endgroup::"

          echo "::group::VERDICT"
          if [ "$SEC" -ge 1 ]; then
            echo "Secret key IS present ($SEC). Signing failure must be expiry/subkey/passphrase — see metadata above."
          elif [ "$PUB" -ge 1 ]; then
            echo "VERDICT: PACKAGING_SECRET_KEY contains a PUBLIC key only (0 secret keys)."
            echo "  This is the wrong half of the keypair. Signing can never work with it."
            echo "  FIX: re-store the org secret with the PRIVATE key, single clean base64 line:"
            echo "       gpg --export-secret-keys --armor <fpr> | base64 -w0   (paste as PACKAGING_SECRET_KEY)"
          else
            echo "VERDICT: value is neither an importable public nor secret key (malformed). Regenerate/re-export."
          fi
          echo "::endgroup::"
          exit 0
