name: diag-signing-secret

# TEMP DIAGNOSTIC — safe to delete. Reads PACKAGING_SECRET_KEY / PACKAGING_PASSPHRASE
# and prints ONLY non-sensitive metadata (lengths, encoding shape, imported key
# capabilities/expiry). It NEVER prints key material or the passphrase. Used to
# determine why the nightly signing legs report "No secret key".

on:
  push:
    branches:
      - diag/signing-secret
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect signing secret (metadata only, never prints key material)
        env:
          PACKAGING_SECRET_KEY: ${{ secrets.PACKAGING_SECRET_KEY }}
          PACKAGING_PASSPHRASE: ${{ secrets.PACKAGING_PASSPHRASE }}
        run: |
          set +e

          echo "::group::1. Presence / length"
          LEN=$(printf '%s' "$PACKAGING_SECRET_KEY" | wc -c)
          PLEN=$(printf '%s' "$PACKAGING_PASSPHRASE" | wc -c)
          echo "PACKAGING_SECRET_KEY length (bytes): $LEN"
          echo "PACKAGING_PASSPHRASE length (bytes): $PLEN"
          echo "::endgroup::"

          if [ "$LEN" -eq 0 ]; then
            echo "VERDICT: CASE 1 (EMPTY) -> secret not available to this repo"
            echo "  (org secret not scoped to citusdata/tools, or unset)."
            exit 0
          fi

          echo "::group::2. Encoding check"
          RAW_IS_ARMORED=0
          if printf '%s' "$PACKAGING_SECRET_KEY" | head -c 200 | grep -a -q 'BEGIN PGP PRIVATE KEY BLOCK'; then
            RAW_IS_ARMORED=1
            echo "RAW value already contains an ASCII-armored PGP PRIVATE KEY header."
          else
            echo "RAW value does NOT contain an armored PGP header (likely base64 or other)."
          fi

          printf '%s' "$PACKAGING_SECRET_KEY" | base64 -d > /tmp/dec.key 2> /tmp/b64.err
          B64RC=$?
          DECLEN=$(wc -c < /tmp/dec.key 2>/dev/null || echo 0)
          echo "base64 -d exit code: $B64RC ; decoded length (bytes): $DECLEN"
          [ -s /tmp/b64.err ] && echo "base64 stderr (first line): $(head -n1 /tmp/b64.err)"
          DEC_IS_ARMORED=0
          if head -c 200 /tmp/dec.key 2>/dev/null | grep -a -q 'BEGIN PGP PRIVATE KEY BLOCK'; then
            DEC_IS_ARMORED=1
            echo "base64-decoded content IS an armored PGP PRIVATE KEY"
            echo "  (base64-of-armored = the encoding the signer expects)."
          else
            echo "base64-decoded content is NOT an armored PGP key."
          fi
          echo "::endgroup::"

          echo "::group::3. Import into throwaway keyring + report metadata"
          export GNUPGHOME=$(mktemp -d); chmod 700 "$GNUPGHOME"
          IMPORTED=0
          if [ "$DEC_IS_ARMORED" -eq 1 ]; then
            gpg --batch --import /tmp/dec.key 2>/tmp/imp.err && IMPORTED=1
            echo "import(base64-decoded) -> imported=$IMPORTED"
          fi
          if [ "$IMPORTED" -eq 0 ] && [ "$RAW_IS_ARMORED" -eq 1 ]; then
            printf '%s' "$PACKAGING_SECRET_KEY" | gpg --batch --import 2>/tmp/imp.err && IMPORTED=1
            echo "import(raw armored) -> imported=$IMPORTED"
          fi
          [ -s /tmp/imp.err ] && echo "gpg import stderr (first 2 lines):" && head -n2 /tmp/imp.err
          echo "--- secret key capabilities / expiry (no private material) ---"
          gpg --list-secret-keys --keyid-format long 2>/dev/null | grep -E 'sec|ssb|uid|\[' || echo "(no secret keys imported)"
          HAS_SIGN=$(gpg --list-secret-keys --with-colons 2>/dev/null | awk -F: '/^sec|^ssb/ {print $12}' | grep -c 's')
          echo "secret keys with SIGN capability: $HAS_SIGN"
          echo "::endgroup::"

          echo "::group::Verdict"
          if [ "$IMPORTED" -eq 0 ]; then
            if [ "$RAW_IS_ARMORED" -eq 1 ] && [ "$DEC_IS_ARMORED" -eq 0 ]; then
              echo "VERDICT: CASE 2 (ENCODING MISMATCH)"
              echo "  Secret stored as RAW armored key, but the signer runs 'base64 -d' first"
              echo "  => 'base64: invalid input'. Re-store as:"
              echo "     gpg --export-secret-keys --armor <fpr> | base64 -w0"
            else
              echo "VERDICT: CASE 3 (MALFORMED)"
              echo "  Value present but not importable as a secret key. Re-export/re-encode required."
            fi
          else
            if [ "$HAS_SIGN" -eq 0 ]; then
              echo "VERDICT: CASE 4a (NO SIGNING SECRET)"
              echo "  Key imported but has no usable [S] signing secret subkey. Re-export with:"
              echo "     gpg --export-secret-subkeys <fpr>! | base64 -w0"
            else
              echo "Key imported and HAS a signing secret."
              echo "  If the nightly still reports 'No secret key', check the expiry above"
              echo "  (CASE 4b EXPIRED) or the passphrase length (PLEN above, 0 = passphrase missing)."
            fi
          fi
          echo "::endgroup::"
          exit 0
